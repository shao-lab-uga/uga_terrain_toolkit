[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "uga-terrain-toolkit"
version = "0.3.0"
description = "Drivable and walkable terrain maps (elevation, banking, roughness, curbs, sidewalks) and OpenDRIVE from ROS 2 lidar recordings"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.22",
  "pyyaml",
  "pillow",
  "mcap",
  "mcap-ros2-support",
  "zstandard",
  "lz4",
  "fastapi",
  "uvicorn",
]

[project.optional-dependencies]
fast = ["kiss-icp", "pypatchworkpp"]
test = ["pytest"]

[project.scripts]
uga-terrain = "uga_terrain.cli:main"

[tool.setuptools.packages.find]
include = ["uga_terrain*"]

[tool.setuptools.package-data]
"uga_terrain.app" = ["static/*", "static/vendor/three/*", "static/vendor/three/addons/controls/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
